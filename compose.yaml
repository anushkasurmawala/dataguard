services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: dataguard
      POSTGRES_USER: dataguard
      POSTGRES_PASSWORD: dataguard
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dataguard_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dataguard -d dataguard"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  dataguard_pg:
