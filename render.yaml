services:
  - type: web
    name: dataguard-api
    runtime: docker
    plan: free
    rootDir: backend/DataGuard.Api
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        # Set the external Neon connection URL in Render; never commit credentials.
        sync: false
      - key: Database__ApplyMigrations
        value: "true"
      - key: DatasetStorage__KeepFiles
        value: "false"
# Existing Render database retained as a temporary migration backup only.
# The API uses the external DATABASE_URL above and does not depend on this database.
databases:
  - name: dataguard-db
    plan: free
    databaseName: dataguard
    user: dataguard
    postgresMajorVersion: "16"
