services:
  - type: web
    name: dataguard-api
    runtime: docker
    plan: free
    rootDir: backend/DataGuard.Api
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dataguard-db
          property: connectionString
      - key: Database__ApplyMigrations
        value: "true"
      - key: DatasetStorage__KeepFiles
        value: "false"
databases:
  - name: dataguard-db
    plan: free
    databaseName: dataguard
    user: dataguard
    postgresMajorVersion: "16"
